<div class="container-fluid d-flex justify-content-center align-items-center min-vh-100 bg-light">
  <div class="bg-white p-4 rounded shadow-sm" style="width: 100%; max-width: 400px">
    <h2 class="text-center mb-4">Login</h2>
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label for="email" class="form-label">Email address</label>
        <input
          type="email"
          class="form-control"
          id="email"
          placeholder="Enter email"
          formControlName="email"
          [ngClass]="{
            'border-danger': email.invalid && (email.touched || email.dirty),
          }"
        />
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input
          type="password"
          class="form-control"
          id="password"
          placeholder="Enter password"
          formControlName="password"
          [ngClass]="{
            'border-danger': password.invalid && (password.touched || password.dirty),
          }"
        />
      </div>
      <div class="mb-3 form-check">
        <input
          type="checkbox"
          class="form-check-input"
          id="rememberMe"
          formControlName="remember"
        />
        <label class="form-check-label" for="rememberMe">Remember me</label>
      </div>
      <button type="submit" class="btn btn-primary w-100">Login</button>
    </form>
    <p class="text-center mt-3">
      <a href="#">Forgot password?</a>
    </p>
  </div>
</div>
